# ==============================================================================
# VOLODIUM PARFUM — Nginx Production Reverse Proxy Configuration
# Установка на VDS (Ubuntu/Debian):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/volodiumparfum.ru
#   sudo ln -sf /etc/nginx/sites-available/volodiumparfum.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d volodiumparfum.ru -d www.volodiumparfum.ru
#
# ВАЖНО: В файле .env на сервере установите:
#   VP_ENV=production
#   VP_HOST=127.0.0.1
#   VP_PORT=8000
#   VP_BEHIND_PROXY=true
#   VP_TRUSTED_PROXIES=127.0.0.1,::1
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name volodiumparfum.ru www.volodiumparfum.ru;

    server_tokens off;
    client_max_body_size 10M;

    # После получения SSL-сертификата через Certbot рекомендуется включить редирект на HTTPS:
    # return 301 https://volodiumparfum.ru$request_uri;

    # Базовые заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Жёсткий 404 Cloaking на уровне Nginx для сканеров и служебных файлов
    location ~* ^/(\.|env|private_admin|scripts|deploy|venv|backups|__pycache__)(/|$) {
        return 404;
    }

    location ~* \.(env|py|pyc|db|db-wal|db-shm|sqlite|sqlite3|log|bak|sh|md|example)$ {
        return 404;
    }

    location ~* ^/(admin|admin\.html|wp-admin|wp-login|administrator|phpmyadmin|xmlrpc\.php|requirements\.txt|readme) {
        return 404;
    }

    # Кэширование статических медиафайлов витрины (кроме закрытой админки и загрузок)
    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Все маршруты витрины, API и скрытый шлюз VP_ADMIN_PATH проксируются в FastAPI
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

