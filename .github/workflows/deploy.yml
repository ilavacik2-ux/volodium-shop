name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting automated deployment for VOLODIUM PARFUM..."
            cd /var/www/volodium

            # Pull latest changes from main branch
            git fetch origin main
            git reset --hard origin/main

            # Install any new dependencies if requirements.txt changed
            if [ -d "venv" ]; then
              ./venv/bin/pip install --quiet -r requirements.txt
            fi

            # Ensure proper file permissions
            chown -R www-data:www-data /var/www/volodium || true
            chmod 775 /var/www/volodium || true
            chmod 664 /var/www/volodium/volodium_database.db* 2>/dev/null || true

            # Restart the service
            systemctl restart volodium

            echo "✅ Deployment completed successfully!"
